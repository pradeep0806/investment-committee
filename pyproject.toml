[project]
name = "committee"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.34",
    "openai>=1.40",
    "litellm>=1.44",
    "motor>=3.5",
    "redis>=5.0",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "prometheus-fastapi-instrumentator>=7.0",
    "mlflow>=2.14",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "httpx>=0.27",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
committee = "committee.cli.main:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
