# Self-hosted Mongo/Redis, sized for demonstrating the deployment shape.
# In an actual production deployment, prefer managed services (MongoDB Atlas,
# Memorystore/ElastiCache) — running stateful databases yourself on Kubernetes is an
# ongoing operational cost (backups, failover, patching) this project doesn't need to
# take on to demonstrate the orchestration logic being evaluated.

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: investment-committee
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: investment-committee
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
  clusterIP: None   # headless, required to match the StatefulSet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: investment-committee
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: "100m", memory: "64Mi" }
            limits: { cpu: "250m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: investment-committee
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
