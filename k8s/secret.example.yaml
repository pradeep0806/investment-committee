# cp secret.example.yaml secret.yaml, fill in real values, then:
#   kubectl apply -f k8s/secret.yaml
# secret.yaml must never be committed — add it to .gitignore.

apiVersion: v1
kind: Secret
metadata:
  name: committee-secrets
  namespace: investment-committee
type: Opaque
stringData:
  LLM_API_KEY: "REPLACE_ME"
  MONGO_URI: "mongodb://mongo:27017"
  REDIS_URL: "redis://redis:6379/0"
  GRAFANA_ADMIN_PASSWORD: "REPLACE_ME"
